version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: raven_db
    environment:
      POSTGRES_USER: raven_user
      POSTGRES_PASSWORD: raven_password
      POSTGRES_DB: raven_incidents
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raven_user -d raven_incidents"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: raven_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://raven_user:raven_password@db:5432/raven_incidents
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

volumes:
  pgdata:
